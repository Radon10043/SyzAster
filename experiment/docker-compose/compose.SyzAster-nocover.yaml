#############################
### General configuration ###
#############################
x-base: &base
  image: github.com/radon10043/syzaster:latest
  privileged: true
  cpus: ${EXPERIMENT_CPUS}
  tmpfs:
    - /tmp
    - /var/tmp
  environment: &env
    TMPDIR: /tmp
    VMCOUNT: ${EXPERIMENT_VMCOUNT}
    SYZASTER: ${EXPERIMENT_ROOT_CONTAINER}/fuzzer/SyzAster
    SYZKALLER: /syzkaller
    OUTROOT: ${EXPERIMENT_ROOT_CONTAINER}/experiment/SyzAster-nocover
  volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    - ${EXPERIMENT_ROOT_HOST:?EXPERIMENT_ROOT_HOST is required}:${EXPERIMENT_ROOT_CONTAINER:?EXPERIMENT_ROOT_CONTAINER is required}

####################
### Project name ###
####################
name: syzaster-nocover

services:

  asterinas-v0.19.0-kernel:
    <<: *base
    environment:
      <<: *env
      KERNEL: ${EXPERIMENT_ROOT_CONTAINER}/kernel/asterinas/v0.19.0
      IMAGE: ${EXPERIMENT_ROOT_CONTAINER}/image/asterinas/v0.19.0-nocover
      KERNEL_NAME: asterinas
      KERNEL_VERSION: "v0.19.0"
      SUBSYSTEM: kernel
    command:
      - bash
      - -ceu
      - |
        cp -a "$$SYZASTER/syzkaller" /syzkaller
        export SUFFIX="$$(cat /proc/sys/kernel/random/uuid | cut -d- -f1)"
        export WORKDIR="$$OUTROOT/$$KERNEL_NAME-$$KERNEL_VERSION-$$SUBSYSTEM/out-$$SUFFIX"
        mkdir -p "$$WORKDIR"
        # Uninstrumented baseline: kernel.cfg with coverage off. The image has
        # no kernel/vmlinux, so the kernel object / source dirs are dropped.
        perl -pe 's/__([a-zA-Z0-9_]+)__/$$ENV{$$1}/g' "$$SYZASTER/configs/fuzz/$$KERNEL_NAME/kernel.cfg" \
          | jq '.cover = false | .name += "-nocover" | .tag += "-nocover" | del(.kernel_obj, .kernel_src, .kernel_build_src)' \
          > "$$WORKDIR/fuzz.cfg"
        timeout -s KILL 24h "/syzkaller/bin/syz-manager" -config "$$WORKDIR/fuzz.cfg" -bench "$$WORKDIR/bench.log" > "$$WORKDIR/fuzz.log" 2>&1

