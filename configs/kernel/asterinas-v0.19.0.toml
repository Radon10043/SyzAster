# Asterinas v0.19.0 Kernel Build Configuration for SyzAster

[kernel]
name = "asterinas"
version = "0.19.0"
commit = "c4b7ed575b7b32773475b194d2ad41fb6d03765b"
target_arch = "x86_64"
rust_toolchain = "nightly-2026-07-21"
patch_dir = "patch/asterinas/v0.19.0"

[build]
kcov = 1
release = 0
release_lto = 0
boot_protocol = "linux-efi-handover64"
console = "ttyS0"
log_level = "error"
cargo_profile_dev_lto = false
cargo_profile_release_lto = false
rustc_wrapper = "tools/kcov-rustc.sh"
unstripped_elf = "target/x86_64-unknown-none/debug/asterinas-osdk-bin"
nixos_image = "target/nixos/asterinas.img"
