# Asterinas v0.17.1 Kernel Build Configuration for SyzAster

[kernel]
name = "asterinas"
version = "0.17.1"
commit = "9ea44ed2b60bc81a5efb18af79e41fc07bf3d523"
target_arch = "x86_64"
rust_toolchain = "nightly-2025-12-06"
patch_dir = "patch/asterinas/v0.17.1"

[build]
kcov = 1
release = 0
release_lto = 0
boot_protocol = "linux-efi-handover64"
console = "ttyS0"
log_level = "error"
cargo_profile_dev_lto = false
cargo_profile_release_lto = false
rustc_wrapper = "tools/kcov-rustc.sh"
unstripped_elf = "target/x86_64-unknown-none/debug/aster-kernel-osdk-bin"
nixos_image = "target/nixos/asterinas.img"
